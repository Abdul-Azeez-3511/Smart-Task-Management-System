<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07070f;
      --surface:  #0f0f1a;
      --surface2: #141424;
      --border:   #1c1c2e;
      --accent:   #7c6af7;
      --accent2:  #f76a8a;
      --accent3:  #6af7c4;
      --text:     #e2e2f0;
      --muted:    #64648a;
      --low:      #6af7c4;
      --medium:   #f7c46a;
      --high:     #f76a8a;
      --pending:  #6a9ff7;
      --progress: #c46af7;
      --done:     #6af7c4;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 28px 24px;
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800;
      letter-spacing: -1px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .logo-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }
    .nav { padding: 20px 12px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      color: var(--muted); cursor: pointer;
      transition: all .2s; margin-bottom: 4px;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(124,106,247,.12);
      color: var(--text);
    }
    .nav-icon { font-size: 18px; }
    .sidebar-footer {
      padding: 16px 12px;
      border-top: 1px solid var(--border);
    }
    #userInfo {
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 13px;
    }
    #userInfo strong { display: block; font-size: 14px; margin-bottom: 2px; }
    #userInfo span { color: var(--muted); font-size: 12px; }
    .logout-btn {
      width: 100%; margin-top: 10px; padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px; background: transparent;
      color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 13px; cursor: pointer; transition: all .2s;
    }
    .logout-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Main ── */
    .main {
      margin-left: 240px;
      min-height: 100vh;
      padding: 32px;
    }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Page Header ── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700; }
    .page-subtitle { color: var(--muted); font-size: 14px; margin-top: 3px; }

    /* ── Toast ── */
    #toast-container {
      position: fixed; top: 24px; right: 24px; z-index: 999;
      display: flex; flex-direction: column; gap: 10px;
    }
    .toast {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 14px;
      min-width: 260px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
      animation: toastIn .3s cubic-bezier(.16,1,.3,1) both;
    }
    .toast.error { border-left-color: var(--accent2); }
    .toast.success { border-left-color: var(--accent3); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* ── Analytics Cards ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 20px;
      position: relative; overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute; top: -20px; right: -20px;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--card-color, var(--accent));
      opacity: .08;
    }
    .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px; }
    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 32px; font-weight: 800;
      color: var(--card-color, var(--text));
    }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transition: width .8s cubic-bezier(.16,1,.3,1);
    }

    /* ── Filters & Add button ── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      cursor: pointer; transition: all .2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(124,106,247,.15);
      border-color: var(--accent);
      color: var(--text);
    }
    .add-btn {
      margin-left: auto;
      padding: 10px 20px;
      background: var(--accent);
      border: none; border-radius: 10px;
      color: #fff;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; gap: 8px;
    }
    .add-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,106,247,.4); }

    /* ── Task List ── */
    #taskList { display: flex; flex-direction: column; gap: 10px; }
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex; align-items: center; gap: 16px;
      transition: all .2s;
      animation: fadeIn .3s ease;
    }
    .task-card:hover { border-color: rgba(124,106,247,.3); transform: translateX(2px); }

    .task-priority-bar {
      width: 3px; height: 40px; border-radius: 99px; flex-shrink: 0;
    }
    .priority-low    { background: var(--low); }
    .priority-medium { background: var(--medium); }
    .priority-high   { background: var(--high); }

    .task-info { flex: 1; min-width: 0; }
    .task-title {
      font-weight: 500; font-size: 15px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .task-title.done { text-decoration: line-through; color: var(--muted); }
    .task-desc { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .task-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .badge {
      padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 500;
      text-transform: capitalize; letter-spacing: .03em;
    }
    .badge-pending    { background: rgba(106,159,247,.15); color: var(--pending); }
    .badge-in_progress{ background: rgba(196,106,247,.15); color: var(--progress); }
    .badge-completed  { background: rgba(106,247,196,.15); color: var(--done); }
    .badge-low    { background: rgba(106,247,196,.12); color: var(--low); }
    .badge-medium { background: rgba(247,196,106,.12); color: var(--medium); }
    .badge-high   { background: rgba(247,106,138,.12); color: var(--high); }

    .icon-btn {
      width: 32px; height: 32px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all .2s; color: var(--muted);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--text); }
    .icon-btn.del:hover { border-color: var(--accent2); color: var(--accent2); }

    .empty-state {
      text-align: center; padding: 80px 20px; color: var(--muted);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; animation: overlayIn .2s ease; }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      width: 100%; max-width: 480px;
      box-shadow: 0 40px 80px rgba(0,0,0,.5);
      animation: modalIn .3s cubic-bezier(.16,1,.3,1);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; }
    input[type=text], textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input[type=text]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,106,247,.12);
    }
    textarea { resize: vertical; min-height: 90px; }
    select option { background: var(--surface); }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-cancel {
      flex: 1; padding: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--muted);
      font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all .2s;
    }
    .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
    .btn-primary {
      flex: 2; padding: 12px;
      background: var(--accent); border: none;
      border-radius: 10px; color: #fff;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: all .2s;
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(124,106,247,.4); transform: translateY(-1px); }

    /* ── Live indicator ── */
    .live-dot {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--done); font-weight: 500;
    }
    .live-dot::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--done);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    /* ── Analytics page ── */
    .analytics-section { margin-top: 28px; }
    .section-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .priority-bars { display: flex; flex-direction: column; gap: 12px; }
    .pbar-row { display: flex; align-items: center; gap: 12px; }
    .pbar-label { width: 70px; font-size: 13px; text-transform: capitalize; color: var(--muted); }
    .pbar-track { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .pbar-fill { height: 100%; border-radius: 99px; transition: width .8s cubic-bezier(.16,1,.3,1); }
    .pbar-count { width: 30px; font-size: 13px; font-weight: 500; text-align: right; }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 680px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-dot"></div>TaskFlow</div>
    <nav class="nav">
      <div class="nav-item active" data-page="tasks" onclick="switchPage('tasks')">
        <span class="nav-icon">📋</span> My Tasks
      </div>
      <div class="nav-item" data-page="analytics" onclick="switchPage('analytics')">
        <span class="nav-icon">📊</span> Analytics
      </div>
    </nav>
    <div class="sidebar-footer">
      <div id="userInfo"><strong>—</strong><span>loading…</span></div>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Tasks Page -->
    <div class="page active" id="page-tasks">
      <div class="page-header">
        <div>
          <div class="page-title">My Tasks</div>
          <div class="page-subtitle">Manage and track your work</div>
        </div>
        <span class="live-dot" id="liveIndicator">Live</span>
      </div>

      <!-- Mini stats bar -->
      <div class="stats-grid" id="miniStats">
        <div class="stat-card" style="--card-color:var(--accent)">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="mTotal">—</div>
        </div>
        <div class="stat-card" style="--card-color:var(--pending)">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="mPending">—</div>
        </div>
        <div class="stat-card" style="--card-color:var(--progress)">
          <div class="stat-label">In Progress</div>
          <div class="stat-value" id="mProgress">—</div>
        </div>
        <div class="stat-card" style="--card-color:var(--done)">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="mDone">—</div>
          <div class="progress-bar"><div class="progress-fill" id="mPct" style="width:0%"></div></div>
        </div>
      </div>

      <div class="toolbar">
        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
        <button class="filter-btn" onclick="setFilter('in_progress', this)">In Progress</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
        <button class="add-btn" onclick="openModal()">＋ Add Task</button>
      </div>

      <div id="taskList"></div>
    </div>

    <!-- Analytics Page -->
    <div class="page" id="page-analytics">
      <div class="page-header">
        <div>
          <div class="page-title">Analytics</div>
          <div class="page-subtitle">Powered by Pandas & NumPy</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card" style="--card-color:var(--accent)">
          <div class="stat-label">Total Tasks</div>
          <div class="stat-value" id="aTotal">—</div>
          <div class="stat-sub" id="aAvg">avg per day</div>
        </div>
        <div class="stat-card" style="--card-color:var(--done)">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="aCompleted">—</div>
        </div>
        <div class="stat-card" style="--card-color:var(--pending)">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="aPending">—</div>
        </div>
        <div class="stat-card" style="--card-color:var(--progress)">
          <div class="stat-label">Completion %</div>
          <div class="stat-value" id="aPct">—</div>
          <div class="progress-bar"><div class="progress-fill" id="aPctBar" style="width:0%"></div></div>
        </div>
      </div>

      <div class="analytics-section">
        <div class="section-title">Priority Breakdown</div>
        <div class="priority-bars" id="priorityBars"></div>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
    <div class="modal">
      <h2 id="modalTitle">Add Task</h2>
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="taskTitle" placeholder="What needs to be done?"/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="taskDesc" placeholder="Optional details…"></textarea>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-group" id="statusGroup" style="display:none">
        <label>Status</label>
        <select id="taskStatus">
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──
    let tasks        = [];
    let currentFilter = 'all';
    let editingId     = null;
    let socket        = null;

    // ── Init ──
    async function init() {
      await loadUser();
      await loadTasks();
      await loadAnalytics();
      connectSocket();
    }

    async function loadUser() {
      const res  = await fetch('/api/auth/me');
      if (!res.ok) { window.location.href = '/login'; return; }
      const user = await res.json();
      document.getElementById('userInfo').innerHTML =
        `<strong>${user.username}</strong><span>${user.email}</span>`;
    }

    // ── WebSocket ──
    function connectSocket() {
      socket = io();
      socket.emit('join', {});

      socket.on('task_update', data => {
        if (data.action === 'created') {
          tasks.unshift(data.task);
          toast(`New task added: "${data.task.title}"`, 'success');
        } else if (data.action === 'updated') {
          const idx = tasks.findIndex(t => t.id === data.task.id);
          if (idx !== -1) tasks[idx] = data.task;
          toast(`Task updated`, 'info');
        } else if (data.action === 'deleted') {
          tasks = tasks.filter(t => t.id !== data.task_id);
          toast(`Task removed`, 'info');
        }
        renderTasks();
        loadAnalytics();
        updateMiniStats();
      });

      socket.on('joined', () => {
        document.getElementById('liveIndicator').style.display = 'inline-flex';
      });
    }

    // ── Tasks ──
    async function loadTasks() {
      const res = await fetch('/api/tasks');
      if (!res.ok) return;
      tasks = await res.json();
      renderTasks();
      updateMiniStats();
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      let filtered = currentFilter === 'all' ? tasks : tasks.filter(t => t.status === currentFilter);

      if (!filtered.length) {
        list.innerHTML = `<div class="empty-state">
          <div class="emoji">✅</div>
          <p>${currentFilter === 'all' ? 'No tasks yet. Add your first one!' : 'No tasks with this status.'}</p>
        </div>`;
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="task-card" id="task-${t.id}">
          <div class="task-priority-bar priority-${t.priority}"></div>
          <div class="task-info">
            <div class="task-title ${t.status === 'completed' ? 'done' : ''}">${escHtml(t.title)}</div>
            ${t.description ? `<div class="task-desc">${escHtml(t.description)}</div>` : ''}
          </div>
          <div class="task-meta">
            <span class="badge badge-${t.priority}">${t.priority}</span>
            <span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span>
            <button class="icon-btn" onclick="openEdit(${t.id})" title="Edit">✏️</button>
            <button class="icon-btn del" onclick="deleteTask(${t.id})" title="Delete">🗑</button>
          </div>
        </div>
      `).join('');
    }

    function updateMiniStats() {
      const total    = tasks.length;
      const done     = tasks.filter(t => t.status === 'completed').length;
      const pending  = tasks.filter(t => t.status === 'pending').length;
      const progress = tasks.filter(t => t.status === 'in_progress').length;
      const pct      = total ? Math.round(done / total * 100) : 0;

      document.getElementById('mTotal').textContent   = total;
      document.getElementById('mPending').textContent = pending;
      document.getElementById('mProgress').textContent= progress;
      document.getElementById('mDone').textContent    = done;
      document.getElementById('mPct').style.width     = pct + '%';
    }

    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderTasks();
    }

    // ── Analytics ──
    async function loadAnalytics() {
      const res  = await fetch('/api/analytics');
      if (!res.ok) return;
      const data = await res.json();

      document.getElementById('aTotal').textContent    = data.total;
      document.getElementById('aCompleted').textContent= data.completed;
      document.getElementById('aPending').textContent  = data.pending;
      document.getElementById('aPct').textContent      = data.completion_pct + '%';
      document.getElementById('aPctBar').style.width   = data.completion_pct + '%';
      document.getElementById('aAvg').textContent      = data.avg_tasks_per_day + ' avg / day';

      const colors = { low: 'var(--low)', medium: 'var(--medium)', high: 'var(--high)' };
      const total  = data.total || 1;
      const pb     = document.getElementById('priorityBars');
      pb.innerHTML = Object.entries(data.priority_breakdown).map(([k, v]) => `
        <div class="pbar-row">
          <div class="pbar-label">${k}</div>
          <div class="pbar-track">
            <div class="pbar-fill" style="width:${Math.round(v/total*100)}%;background:${colors[k]||'var(--accent)'}"></div>
          </div>
          <div class="pbar-count">${v}</div>
        </div>
      `).join('') || '<p style="color:var(--muted);font-size:14px">No data yet.</p>';
    }

    // ── Modal ──
    function openModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Task';
      document.getElementById('taskTitle').value   = '';
      document.getElementById('taskDesc').value    = '';
      document.getElementById('taskPriority').value = 'medium';
      document.getElementById('statusGroup').style.display = 'none';
      document.getElementById('modalOverlay').classList.add('open');
      setTimeout(() => document.getElementById('taskTitle').focus(), 100);
    }

    function openEdit(id) {
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Task';
      document.getElementById('taskTitle').value    = t.title;
      document.getElementById('taskDesc').value     = t.description;
      document.getElementById('taskPriority').value = t.priority;
      document.getElementById('taskStatus').value   = t.status;
      document.getElementById('statusGroup').style.display = 'block';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function closeModalOnBg(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    async function saveTask() {
      const title    = document.getElementById('taskTitle').value.trim();
      const desc     = document.getElementById('taskDesc').value.trim();
      const priority = document.getElementById('taskPriority').value;
      const status   = document.getElementById('taskStatus').value;

      if (!title) { toast('Title is required', 'error'); return; }

      const payload = { title, description: desc, priority };
      if (editingId) payload.status = status;

      const url    = editingId ? `/api/tasks/${editingId}` : '/api/tasks';
      const method = editingId ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) { toast('Failed to save task', 'error'); return; }
      closeModal();
      // WebSocket will trigger re-render
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      if (!res.ok) toast('Failed to delete task', 'error');
      // WebSocket will trigger re-render
    }

    // ── Logout ──
    async function doLogout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    // ── Page switch ──
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${page}`).classList.add('active');
      document.querySelector(`[data-page="${page}"]`).classList.add('active');
      if (page === 'analytics') loadAnalytics();
    }

    // ── Toast ──
    function toast(msg, type='info') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Keyboard ──
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
